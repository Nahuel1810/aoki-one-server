# TLS para el servidor de pedidos de Aoki One.
#
# El servidor NO termina TLS: lo hace este proxy. Ver deploy/README.md para por
# que, y para el certbot que emite el certificado.
#
# Instalar en /etc/nginx/sites-available/aoki-one-server y enlazar en
# sites-enabled. Reemplazar pedidos.EJEMPLO.com por el dominio real.

# Puerto 80: solo para que certbot renueve y para redirigir. Nada de la API
# viaja por aca.
server {
    listen 80;
    listen [::]:80;
    server_name pedidos.EJEMPLO.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pedidos.EJEMPLO.com;

    ssl_certificate     /etc/letsencrypt/live/pedidos.EJEMPLO.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pedidos.EJEMPLO.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS: el agente y la app de picking solo hablan HTTPS. Que el navegador y
    # los proxies intermedios no acepten un downgrade.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Los pedidos son chicos y firmados. Un cuerpo grande aca solo puede ser un
    # abuso: se corta en el proxy y no llega a ocupar memoria del servidor.
    client_max_body_size 64k;

    access_log /var/log/nginx/aoki-one-server.access.log;
    error_log  /var/log/nginx/aoki-one-server.error.log;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # El long-poll del agente (RF28) retiene la conexion hasta 25 s. El
        # default de nginx es 60 s de lectura, asi que entra, pero se deja
        # explicito: si alguien sube la espera del long-poll y no toca esto, el
        # proxy corta primero y el agente ve un 504 en vez de una respuesta
        # vacia.
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Sin buffering: el long-poll tiene que contestar en el momento en que
        # aparece trabajo, no cuando el proxy junte bytes suficientes.
        proxy_buffering off;
    }
}
